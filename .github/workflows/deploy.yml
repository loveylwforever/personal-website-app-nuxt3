name: Deploy to Vercel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'production' || 'preview' }}

      - name: Build
        run: vercel build ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '--prod' || '' }}

      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '--prod' || '' }}
